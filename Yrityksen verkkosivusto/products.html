<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla – Products</title>
  <link rel="stylesheet" href="styles_products.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="logo" href="index.html"><img src="logo.png" alt="Tesla"></a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" class="active">Products</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <img class="hero" src="products.png" alt="Tesla vehicle lineup">

      <p class="intro">
        Why drive when you can fly?
      </p>

      <section class="products">

        <article class="product">
          <h2>Model Y</h2>
          <img src="model-y.png" alt="Tesla Model Y L Premium">
          <p class="caption">Model Y</p>
          <p>
            Starting at $61,990.
          </p>
        </article>

        <article class="product">
          <h2>Cybertruck</h2>
          <img src="cybertruck.png" alt="Tesla Cybertruck">
          <p class="caption">Cybertruck</p>
          <p>
           Lease from $1,129/mo.
          </p>
        </article>

        <article class="product">
          <h2>Roadster</h2>
          <img src="roadster.png" alt="Tesla Roadster">
          <p class="caption">Roadster</p>
          <p>
            Roadster, reserve now.
          </p>
        </article>

      </section>
    </main>

  </div>
</body>
</html>
